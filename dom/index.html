<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>acervo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>acervo mpb</h2>
            </div>
        </div>
    </div>

    <section class="hero">
        <h1>acervo artistas mpb</h1>
        <p>Página criada para ajudar as pessoas a armazenar e salvar as fotos de seus artistas favoritos, assim, protegendo essas memórias.</p>
    </section>

    <main>

        <div class="formulario">

            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Digite o título">

            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Digite a descrição">

            <label for="imagem">Imagem</label>
            <input type="file" id="imagem">

            <button id="adicionar">Adicionar</button>

        </div>

        <div id="lista"></div>

    </main>

    <footer>
        <div class="container">
            <p>
                ETECVAV • 2026<br>
                Página desenvolvida por: Laura Cristina Gonçalves da Cruz e Lucas Oliveira Souza.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
